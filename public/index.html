<!DOCTYPE html>
<html>

<head>
    <title>Furniture</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
        }
        
        .grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        img {
            width: 200px;
            height: 150px;
            margin: 10px;
        }
        
        button {
            background: #2c1f17;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        button:hover {
            background: #5a3d2b;
        }
        
        .card {
            transition: 0.3s;
        }
        
        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <p>📞 Call: +91 7024893242
        <br>+91 7898434769</p>


    <h1 style="text-align:center;">Our Furniture</h1>

    <div id="items" style="
display: flex;
flex-wrap: wrap;
justify-content: center;
gap: 30px;
padding: 20px;
"></div>

    <script>
        fetch('/items')
            .then(res => res.json())
            .then(data => {
                const div = document.getElementById('items');

                // ✅ CLEAR OLD DATA FIRST
                div.innerHTML = "";

                data.forEach(item => {
                    div.innerHTML += `
            <div class="card">
                <img src="${item.image}" onerror="this.src='https://via.placeholder.com/200'">
                <h3>${item.name}</h3>
            </div>
            `;
                });
            });
    </script>
    <script>
        data.forEach(item => {
        const div = document.createElement('div');
        div.style.width = "250px";
        div.style.border = "1px solid #ddd";
        div.style.borderRadius = "10px";
        div.style.padding = "10px";
        div.style.textAlign = "center";
        div.style.boxShadow = "0 4px 10px rgba(0,0,0,0.1)";
        div.style.background = "#fff";
        div.innerHTML = `
    <img src="${item.image}" style="width:100%; height:180px; object-fit:cover; border-radius:10px;">
    <h3 style="margin-top:10px;">${item.name}</h3>
    `;
        container.appendChild(div);
        });
        });
    </script>

    <script>
        fetch('/items')
            .then(res => res.json())
            .then(data => {
                const div = document.getElementById('items');
                data.forEach(item => {
                    div.innerHTML += `
    <div class="card">
      <img src="${item.image}">
      <h3>${item.name}</h3>
    </div>`;
                });
            });
    </script>
    <a href="https://wa.me/917898434769" target="_blank" style="position:fixed;bottom:20px;right:20px;
background:#25D366;color:white;padding:15px;
border-radius:50%;text-decoration:none;font-size:20px;">
💬

</body>

</html>
